name: CI

on:
  pull_request:
    branches: [c4t, dev]
  workflow_dispatch:

# Cancel ongoing workflow runs if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  go_version: "~1.23.9"

permissions:
  # Required: allow read access to the content for analysis.
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
  # Optional: allow write access to checks to allow the action to annotate code in the PR.
  checks: write

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dependencies
        run: git submodule update --init
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go_version }}
      - name: Install libolm
        run: sudo apt update && sudo apt-get install -y libolm-dev
      - name: build_test
        shell: bash
        run: ./scripts/build_test.sh

  # When the golangci-lint version is updated here, also update it in scripts/lint.sh
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dependencies
        run: git submodule update --init
      - name: Install libolm
        run: sudo apt update && sudo apt-get install -y libolm-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go_version }}
      - name: Execute linter script
        shell: bash
        run: ./scripts/lint.sh
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dependencies
        run: git submodule update --init
      - name: Run shellcheck
        shell: bash
        run: scripts/shellcheck.sh
        
  check_clean_branch:
    name: Check that go mod tidy and code-gen are performed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dependencies
        run: git submodule update --init
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go_version }}
      - name: Install libolm
        run: sudo apt update && sudo apt install -y libolm-dev
      - name: Go Mod Tidy
        shell: bash
        run: go mod tidy
      - name: codegen
        shell: bash
        run: ./scripts/generate_grpc_service_handlers.sh
      - uses: bufbuild/buf-setup-action@v1.47.2
      - name: protobuf codegen
        shell: bash
        run: ./scripts/protobuf_codegen.sh
      - name: mockgen
        shell: bash
        run: ./scripts/mock.gen.sh
      - name: Check Clean Branch
        shell: bash
        run: .github/workflows/check-clean-branch.sh

  build_docker:
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true      
          
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            c4tplatform/camino-messenger-bot:temp

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dependencies
        run: git submodule update --init
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go_version }}
      - name: Install libolm
        run: sudo apt update && sudo apt-get install -y libolm-dev
      - name: build bot
        shell: bash
        run: ./scripts/build.sh
      - name: build partner-plugin mock
        shell: bash
        run: ./scripts/build_partner_plugin_mock.sh
      - name: e2e
        shell: bash
        run: ./scripts/e2e.sh
